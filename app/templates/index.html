<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="container">
        <h1>Task Manager</h1>
        <p class="subtitle">Projet DevOps &middot; version <strong>{{ version }}</strong></p>

        <form action="{{ url_for('add_task') }}" method="post" class="add-form">
            <input type="text" name="title" placeholder="Nouvelle tâche..." required>
            <button type="submit">Ajouter</button>
        </form>

        {% if tasks %}
        <p class="counter">
            {{ tasks|lenght }} tâche(s) &middot;
            {{ tasks|selectattr('done')|list|length }} terminée(s)
        </p>
        <ul class="task-list">
            {% for task in tasks %}
            <li class="task {% if task.done %}done{% endif %}">
                <span class="title">{{ task.title }}</span>
                <div class="actions">
                    <form action="{{ url_for('mark_done', task_id=task.id) }}" method="post">
                        <button type="submit" class="btn-done">
                            {% if task.done %}Annuler{% else %}Terminer{% endif %}
                        </button>
                    </form>
                    <form action="{{ url_for('delete_task', task_id=task.id) }}" method="post">
                        <button type="submit" class="btn-delete">Supprimer</button>
                    </form>
                </div>
            </li>
            {% endfor %}
        </ul>
        {% else %}
        <p class="empty">Aucune tâche pour le moment. Ajoutez-en une !</p>
        {% endif %}
    </main>
</body>
</html>
